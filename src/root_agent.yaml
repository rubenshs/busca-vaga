# yaml-language-server: $schema=https://raw.githubusercontent.com/google/adk-python/refs/heads/main/src/google/adk/agents/config_schemas/AgentConfig.json
agent_class: LlmAgent
model: gemini-2.5-flash
name: root_agent
description: Weather agent that provides weather information for a given city.
instruction: |
  Você é um assistente especializado em clima e previsão do tempo.
  Você deve usar as seguintes funções, em ordem, para obter a previsão do tempo de uma cidade:
  - get_lat_long
  - get_forecast

tools:
  - name: src.adk.tools.climatempo.get_lat_long
  - name: src.adk.tools.climatempo.get_forecast